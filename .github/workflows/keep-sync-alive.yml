name: Keep the sync service awake

# Supabase's free plan pauses a project that sees too little database activity over a week ("typically a few
# user requests to the database each day over the previous week is enough", supabase.com/docs/guides/platform/
# free-project-pausing), and the sync service (docs/sync.sql) is one: devices only call it when a linked device
# syncs. Twice a week was not enough (it was paused on 2026-10-12 after pings on Oct 7, 8 and 12), so this runs
# every six hours and asks it two harmless questions each time: sync_get for codes that cannot exist, which
# read the table and write nothing. GitHub often starts scheduled runs hours late, which four a day absorbs.
# If the project is paused or unreachable the run fails, and GitHub emails the repository owner: resume it from
# the Supabase dashboard (within 90 days). Remove this file if the project moves to a paid plan. (GitHub turns
# scheduled workflows off after 60 days without any repository activity, and emails before it does.)
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17 and 18:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/sync/config.ts
          sparse-checkout-cone-mode: false
      - name: Ask the sync service two read-only questions
        run: |
          # The address and the public key are the app's own (src/sync/config.ts): one place to change.
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/sync/config.ts | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" src/sync/config.ts | head -1)
          test -n "$URL" && test -n "$KEY"
          for code in KEEPAWAKE0000000000A KEEPAWAKE0000000000B; do
            status=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-all-errors --max-time 20 \
              -X POST "$URL/rest/v1/rpc/sync_get" -H "apikey: $KEY" -H 'Content-Type: application/json' \
              -d "{\"code\":\"$code\"}")
            echo "$URL answered HTTP $status: $(head -c 200 body.txt)"
            if [ "$status" != 200 ]; then
              echo "::error::The sync service did not answer (HTTP $status). If Supabase paused the project, resume it from the dashboard."
              exit 1
            fi
            sleep 5
          done
