[package]
name = "tempo"
version = "0.1.0"
description = "Tempo Chess Gym: the web app in a Mac window"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
tauri = { version = "2.12.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
