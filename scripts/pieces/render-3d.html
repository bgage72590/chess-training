<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Staunton 3D piece renderer</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; background: #888; }
    </style>
  </head>
  <body>
    <script type="module">
      // Driven by render-3d.cjs: renders the 12 sprites and leaves the result on window.__result.
      import { renderAll } from './staunton3d.js';
      const q = new URLSearchParams(location.search);
      window.__result = renderAll({
        size: Number(q.get('size') || 1024),
        out: Number(q.get('out') || 256),
        only: q.get('only') ? q.get('only').split(',') : null,
        debug: q.get('debug') === '1',
      }).catch((e) => ({ error: String((e && e.stack) || e) }));
    </script>
  </body>
</html>
